# 已申报的缺口与豁免
#
# 诊断层会报出两类东西：它发现的缺口，和它认为无效的规则。
# 这里登记的是「已经知道、并且接受」的部分。
#
# 原则：申报过的缺口不报，没申报的必须报。
# 不这么做的后果很具体——工具每次输出「只覆盖 6 个省」，看三次之后就没人看了，
# 真正的缺口混在噪声里也发现不了。

# 空间维度的缺口。按 province / level 匹配诊断结果的 GAP-* 条目。
# 目前为空：6 个省的每个子区域都有规则覆盖，没有需要豁免的格子。
accepted_gaps: []

# 有意为之、不参与冲突判定的联动规则。
# 联动规则天然与多条规则在同一份申请上共存，判成「与某条规则冲突」会全是误报。
linked_rules:
  - rule_id: R-LODGING-NO-INVOICE
    reason: >
      联动规则：缺住宿发票导致四项费用全部不得报销。这是后果，不是范围争议。

# 有意为之、永远不起作用的规则。诊断层不会报它们。
# 必须写 reason —— 不写理由就不进白名单，这是防止白名单变成垃圾桶的唯一办法。
intentionally_inert:
  - rule_id: R-LODGING-ROOM-TYPE-SUPERSEDED
    since: "2026-10-16"
    reason: >
      检查是 allowed: any，永远判通过，本身不影响任何结论。
      它存在的唯一目的是与 R-LODGING-ROOM-TYPE（531 号第十三条）构成冲突对，
      让「房型到底要不要限制」这处真实矛盾留在规则库里、能被诊断层检出。
      删掉它冲突就消失了，但那是掩盖不是解决（见 D-007）。

# 时间与来源维度的缺口。诊断层不做时间枚举，只在这里登记，
# 由报告直接引用；运行期的表现是「信息不足」而不是静默通过。
documented_gaps:
  - id: G-001
    what: 住宿费只覆盖 36 个地区中的 6 个
    reason: 控制规则规模，子集选取理由见 docs/article-inventory.md
    severity: accepted
  - id: G-002
    what: 2014-01-01 至 2015-12-31 无住宿费阈值
    reason: 531 号附表原文标注「略」，未取得。运行期判「信息不足」，不套用现行标准（D-013）
    severity: accepted
  - id: G-003
    what: 伙食补助费标准来自 B/C 层级来源
    reason: 财政部官网未找到附表原件，数值来自地方政府与高校转载；元数据 source.tier 已标明（D-010）
    severity: accepted
  - id: G-004
    what: 2006 版只写 3 条规则
    reason: 目的仅为版本对比；住宿费跨版本无法对比，2006 版只规定「财政部确定标准」而无阈值
    severity: accepted
  - id: G-005
    what: 伙食补助费规则里西藏 / 青海 / 新疆 三档标准从未被测试覆盖
    reason: 这三个省份不在 6 个地区的住宿费子集里，测试数据不覆盖，所以 R-MEALS-ALLOWANCE 的这三个分支从未被执行过。规则本身没错（这三地确实是 120 元档），但数值抄错也不会被发现，补上测试才能验。记在这里是为了让覆盖率上的 3 个空洞有出处，而不是被当成噪声忽略。
    severity: open
