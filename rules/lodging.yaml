  check:
    kind: threshold
    field: lodging.nights[].amount
    limits:
      - kind: base
        by_person_level:
          部级: 800
          司局级: 430
          其他人员: 300
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    与凉山州组成一处反直觉的数据：宜宾部级 800 > 凉山 750，但其他人员 300 < 凉山 330。
