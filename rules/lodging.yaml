# 住宿费限额规则
#
# 来源：财行〔2013〕531 号第十四条（规定）+ 财行〔2016〕71 号明细表（阈值）
# 数据：data/lodging-subset.csv（6 个地区 15 行，是 36 个地区的子集）
#
# 数值一律以「元 / 人 · 天」计。规则按「一条规则一行表」组织（见 D-002），
# 每条展开成 3 个检查项（base × 人员级别），有旺季的再加 3 个（peak × 级别）。
#
# 已确认的边界：
#   - 只能覆盖 2016-05-01 之后的申请（2014–2015 年附表未取得，见 D-013）
#   - 「其他地区」是兜底语义，不是城市名（见 D-005）
#   - 本文件不含 2006 版规则（推迟到第 2 周）

- id: R-LODGING-BJ-001
  topic: 住宿费
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第十四条
    table_ref: 财行〔2016〕71号明细表 · 北京市（全市，第1行）
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  threshold_from: "2016-05-01"
  threshold_to: null
  scope:
    province: 北京
    whole_region: true
  when:
    category: 住宿费
  require: [lodging.nights, trip.destination_city, applicant.person_level]
  kind: threshold
  check:
    kind: threshold
    field: lodging.nights[].amount
    limits:
      - kind: base
        by_person_level:
          部级: 1100
          司局级: 650
          其他人员: 500
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    直辖市，「全市」即全省。阈值来自 71 号明细表第 1 行，无旺季上浮。
    这是垂直切片的基准规则：字段、匹配、展开、结果格式都由它先跑通。
  decision: D-002

- id: R-LODGING-HLJ-HARBIN
  topic: 住宿费
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第十四条
    table_ref: 财行〔2016〕71号明细表 · 黑龙江省第1行（哈尔滨市）
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  threshold_from: "2016-05-01"
  threshold_to: null
  scope:
    province: 黑龙江
    cities: [哈尔滨市]
  when:
    category: 住宿费
  require: [lodging.nights, trip.destination_city, applicant.person_level]
  kind: threshold
  check:
    kind: threshold
    field: lodging.nights[].amount
    limits:
      - kind: base
        by_person_level:
          部级: 800
          司局级: 450
          其他人员: 350
      - kind: peak
        months: [7, 8, 9]
        applies_to_cities: [哈尔滨市]
        by_person_level:
          部级: 960
          司局级: 540
          其他人员: 420
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    旺季 7–9 月适用上浮价。逐晚判断，不是整单判断——同一趟行程跨 6 月和 7 月时，
    两晚要用不同限额。这正是必须逐晚建模的原因（D-004）。
    531 号第十二条只说「适当上浮，另行发布」，具体比例见 497 号（哈尔滨 20%）。
  decision: D-004

