# 报销管理与准入规则
#
# 来源：531 号第二条、第三条、第二十四条、第二十五条。
# 这四条不属于某个费用项，而是对整份申请的前置条件与凭证要求。

- id: R-REIMBURSE-UNIT-SCOPE
  topic: 报销管理
  kind: enum
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第二条、第三十一条
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  scope: {}
  when: {}
  require: [applicant.unit_type]
  check:
    kind: enum
    field: applicant.unit_type
    allowed: [中央单位, 参照公务员法管理的事业单位, 其他事业单位]
    # 在允许集合内、但需要人工确认的取值：其他事业单位是「参照执行」，
    # 可能另有本单位细则，不能直接按本办法判通过。
    review_values: [其他事业单位]
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  on_review: 需人工确认
  notes: >
    准入校验，不是费用规则。中央单位与参照公务员法管理的事业单位强制适用；
    其他事业单位是「参照执行」（第三十一条），可能另有本单位细则，
    因此虽然取值合法，仍标为需人工确认（review_values），不直接判通过。
    2006 版第二条把全部事业单位都纳入强制适用（version-history 差异 10）。
    统计覆盖率时不应与费用类规则混在一起——这是两件性质不同的事。
  decision: D-009

- id: R-REIMBURSE-OUTSIDE-STATION
  topic: 报销管理
  kind: predicate
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第三条
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  scope: {}
  when: {}
  require: [trip.origin_city, trip.destination_city]
  check:
    kind: predicate
    expr:
      field: trip.destination_city
      op: ne
      field_ref: trip.origin_city
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    差旅费只覆盖「临时到常驻地以外地区」。同城发生的费用不属差旅费范围。
    这条只判断地理范围，不判断是否公务——后者依赖审批，由 R-REIMBURSE-APPROVAL 负责。
  decision: D-009

- id: R-REIMBURSE-APPROVAL
  topic: 报销管理
  kind: predicate
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第二十五条
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  scope: {}
  when: {}
  require: [trip.approved]
  check:
    kind: predicate
    expr:
      field: trip.approved
      op: eq
      value: true
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    「未经批准出差……不予报销」。第四条要求的「建立健全审批制度」本身无法程序化，
    但「这次出差有没有走审批」是布尔字段，可以判。两条的分工在 article-inventory 第四条里已写明。
  decision: D-009

- id: R-REIMBURSE-VOUCHER
  topic: 报销管理
  kind: predicate
  source:
    doc: 中央和国家机关差旅费管理办法
    doc_no: 财行〔2013〕531号
    article: 第二十四条
    url: https://www.gov.cn/gongbao/content/2014/content_2667621.htm
    tier: A
  version: "2013-531"
  effective_from: "2014-01-01"
  effective_to: null
  scope: {}
  when: {}
  require: [trip.approved, expense_lines, lodging.nights]
  check:
    kind: predicate
    expr:
      all:
        - {field: trip.approved, op: eq, value: true}
        - for_all:
            path: lodging.nights
            test: {field: receipt_present, op: eq, value: true}
        - for_all:
            path: expense_lines
            where: {field: category, op: eq, value: 城市间交通费}
            test: {field: receipt_present, op: eq, value: true}
  on_pass: 通过
  on_fail: 不通过
  on_missing: 信息不足
  notes: >
    「出差审批单、机票、车票、住宿费发票等凭证」末尾有个「等」——是开放列表。
    规则只检查明确列举的三项，其余允许申请人补充说明，
    不能因为不在清单里就判「缺材料」。这是把自然语言列举写成程序规则的常见陷阱（D-012）。
    「及时办理报销」没有时限数字，本规则不涉及。
    住宿发票的核查与 R-LODGING-NO-INVOICE 有重叠——这是有意的，
    一条是凭证完整性，一条是费用后果，两者口径不同（见 D-008 关于重叠与冲突的区别）。
  decision: D-012
