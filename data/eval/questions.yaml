      - {doc_no: "财行〔2013〕531号", article: 第三十条}
    facts: ["举办单位"]
  basis: 531 号第三十条规定会议期间市内交通费由举办单位开支；第二十条又规定按天包干——两条在会议期间冲突，见 ambiguity-log A-007

- id: Q-048
  question: 住宿发票丢了，住宿费和机票还能报吗？
  style: colloquial
  as_of: "2026-10-19"
  expected:
    route: retrieve
    citations_any:
      - {doc_no: "财行〔2013〕531号", article: 第二十五条}
    facts: ["不得报销"]
  basis: 531 号第二十五条：实际发生住宿而无住宿费发票的，不得报销住宿费以及城市间交通费、伙食补助费和市内交通费

- id: Q-049
  question: 出差人员住宿房型有级别限制吗？
  style: formal
  as_of: "2026-10-19"
  expected:
    route: retrieve
    citations_any:
      - {doc_no: "财行〔2013〕531号", article: 第十三条}
      - {doc_no: "财行〔2015〕497号", article: 第三条}
    facts: ["套间"]
  basis: 531 号第十三条规定部级住普通套间；但 497 号第三条明确「不分房型」，两者冲突，见 ambiguity-log A-012

- id: Q-050
  question: 出差期间由接待单位安排了一顿工作餐，我需要交钱吗？交多少？
  style: colloquial
  as_of: "2026-10-19"
  expected:
    route: retrieve
    citations_any:
      - {doc_no: "财行〔2013〕531号", article: 第十八条}
      - {doc_no: "财办行〔2019〕104号", article: 一、}
    facts: ["交纳"]
  basis: 531 号第十八条要求交纳伙食费；104 号第一条给出具体比例（内部食堂无对外标准时早餐 20%、午晚餐各 40%）
