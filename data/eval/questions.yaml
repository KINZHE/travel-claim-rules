# 评测集：50 条
#
# 出题方法（见 docs/eval-design.md）：
#   1. 从条文与规则**反向**构造，不从系统输出构造
#   2. 每条必须有 basis —— 说清标准答案出自哪一条
#   3. 一半用口语化改写，避免人为抬高模式匹配的准确率
#
# 字段说明：
#   style: formal（正式）/ colloquial（口语）—— 两者比例要在 40%–60% 之间
#   as_of: 判断适用哪一版制度的基准日
#   expected.route: compute / retrieve / refuse
#   expected.citations_any: 至少命中其中一条即算命中
#   expected.facts: 答案正文里必须出现的字面内容
#   expected.must_not_contain: 不能出现的内容（抓「档位答错」这类错）
#   expected.refusal: 期望的拒答代码（仅 refuse 类）
#   basis: 标准答案的出处 —— 不能为空

- id: Q-001
  question: 下个月去南京出差，我是司局级，住宿一天最多能报多少？
  style: colloquial
  as_of: "2026-10-19"
  expected:
    route: compute
    citations_any:
      - {doc_no: "财行〔2016〕71号", article_contains: 江苏省}
    facts: ["490"]
    must_not_contain: ["1100", "650"]
  basis: 71 号明细表江苏省第 1 行（南京市、苏州市、无锡市、常州市、镇江市），司局级 490 元/人·天

